{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Lencería Lizzy{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#a83279;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'frontend:inicio' %}">
                <i class="fa-solid fa-shirt"></i> Lencería Lizzy
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="btn btn-outline-light mx-1" href="{% url 'frontend:catalogo' %}">
                        <i class="fa-solid fa-list"></i> Catálogo
                    </a>
                    <a class="btn btn-light mx-1" href="{% url 'frontend:ver_carrito' %}">
                        <i class="fa-solid fa-cart-shopping"></i> Carrito
                    </a>
                    {% if request.user.is_authenticated %}
                        <a class="btn btn-outline-light mx-1" href="{% url 'frontend:favoritos' %}">
                            <i class="fa-solid fa-heart"></i> Favoritos
                        </a>
                        <a class="btn btn-outline-light mx-1" href="{% url 'frontend:mis_pedidos' %}">
                            <i class="fa-solid fa-receipt"></i> Pedidos
                        </a>
                        <a class="btn btn-outline-light mx-1" href="{% url 'frontend:perfil' %}">
                            <i class="fa-solid fa-user"></i> {{ request.user.username }}
                        </a>
                        <form method="post" action="{% url 'frontend:logout' %}" class="mx-1">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-light">
                                <i class="fa-solid fa-right-from-bracket"></i> Salir
                            </button>
                        </form>
                    {% else %}
                        <a class="btn btn-outline-light mx-1" href="{% url 'frontend:login' %}">
                            <i class="fa-solid fa-right-to-bracket"></i> Entrar
                        </a>
                        <a class="btn btn-light mx-1" href="{% url 'frontend:registro' %}">
                            <i class="fa-solid fa-user-plus"></i> Registrarme
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block contenido %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
